name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Lint Python
        run: uv run ruff check src tests

      - name: Check panel JavaScript syntax
        run: node --check src/hive/webpanel/resources/panel.js

      - name: Validate Compose deployment
        run: docker compose config --quiet

      - name: Run offline tests
        run: uv run pytest -q

      - name: Enforce indicator accuracy gate
        run: uv run python -m hive.evaluate
