name: MegaLinter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: MegaLinter
        uses: oxsecurity/megalinter@e23dcb290e28a319c7b0b5d0e6e18cc7bae30782 # v8.4.0
        env:
          # Only linters relevant to this stack (Python/Docker/TS/YAML/MD)
          ENABLE: PYTHON,DOCKER,JSON,MARKDOWN,YAML
          # Don't gate merges on style nits yet; report findings
          APPLY_FIXES_MODE: none
          VALIDATE_ALL_CODEBASE: true
          # Repo-specific tweaks
          PYTHON_RUFF_ARGUMENTS: --exit-zero
          MARKDOWN_MARKDOWNLINT_DISABLE_ARGUMENTS: --disable MD041
          REPORT_OUTPUT_FOLDER: megalinter-reports