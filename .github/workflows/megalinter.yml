---
name: MegaLinter

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: MegaLinter
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          # Only linters relevant to this stack (Python/Docker/TS/YAML/MD)
          ENABLE: PYTHON,DOCKER,JSON,MARKDOWN,YAML
          # Don't gate merges on style nits yet; report findings
          APPLY_FIXES_MODE: none
          VALIDATE_ALL_CODEBASE: true
          # Repo-specific tweaks
          # bandit: reviewed skip-list documented in .bandit (fixture creds, pacing random, sandbox subprocess)
          PYTHON_BANDIT_ARGUMENTS: --skip B101,B104,B105,B106,B107,B108,B110,B311,B404,B602,B603,B607,B608
          # pyright scope mirrors the repo's mypy contract: src only (tests use intentional fakes)
          PYRIGHT_ARGUMENTS: src
          PYTHON_RUFF_ARGUMENTS: --exit-zero
          MARKDOWN_MARKDOWNLINT_DISABLE_ARGUMENTS: --disable MD041
          REPORT_OUTPUT_FOLDER: megalinter-reports
