# HIVE's four-service local stack. Only the frontend is published to the host;
# backend, PostgreSQL, and Qdrant communicate on the private Compose network.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: hive-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9130:80"
    restart: unless-stopped

  backend:
    build: .
    image: hive-backend:latest
    privileged: true
    env_file: .env
    environment:
      HIVE_PANEL_HOST: 0.0.0.0
      HIVE_PANEL_ALLOW_NON_LOOPBACK: "true"
      HIVE_DATABASE_URL: postgresql://hive:${HIVE_POSTGRES_PASSWORD:-hive-local}@postgres:5432/hive
      HIVE_QDRANT_URL: http://qdrant:6333
    expose:
      - "9130"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - hive_dind:/var/lib/docker
      - hive_models:/root/.cache/huggingface
      - ./.env:/app/.env
      - ./secrets:/app/secrets
      - ./evidence:/app/evidence
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_POSTGRES_PASSWORD:-hive-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hive_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  hive_dind:
  hive_models:
    name: hive_model_cache
  hive_postgres:
