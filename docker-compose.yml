# HIVE's four-service local stack. Only the frontend is published to the host;
# backend, PostgreSQL, and Qdrant communicate on the private Compose network.
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: hive-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9130:80"
    restart: unless-stopped

  backend:
    build: .
    image: hive-backend:latest
    privileged: true
    env_file: .env
    environment:
      HIVE_PANEL_HOST: 0.0.0.0
      HIVE_PANEL_ALLOW_NON_LOOPBACK: "true"
      HIVE_DATABASE_URL: postgresql://hive:${HIVE_POSTGRES_PASSWORD:-hive-local}@postgres:5432/hive
      HIVE_QDRANT_URL: http://qdrant:6333
      # Per-child cgroups fail under Docker Desktop's nested daemon.
      # The outer backend limit below contains the sandbox and HIVE together.
      HIVE_SANDBOX_MEMORY_LIMIT: ${HIVE_SANDBOX_MEMORY_LIMIT:-}
      HIVE_SANDBOX_PIDS_LIMIT: ${HIVE_SANDBOX_PIDS_LIMIT:-}
    expose:
      - "9130"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - hive_dind:/var/lib/docker
      - hive_models:/root/.cache/huggingface
      - hive_fastembed:/root/.cache/fastembed
      - ./.env:/app/.env
      - ./secrets:/app/secrets
      - ./evidence:/app/evidence
      - ./evaluation/results:/app/evaluation/results:ro
    mem_limit: 4g
    pids_limit: 1024
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_POSTGRES_PASSWORD:-hive-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d hive"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hive_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  hive_dind:
  hive_models:
    name: hive_model_cache
  hive_fastembed:
    name: hive_fastembed_cache
  hive_postgres:
