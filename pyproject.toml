[project]
name = "hive"
version = "0.1.0"
description = "HIVE — Honeypot for Intelligence, Verdict & Evidence. A deceptive anti-scam agent for Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tho Kai Syuen", email = "TP070466@mail.apu.edu.my" }]

dependencies = [
    "langgraph>=0.2",
    "qdrant-client>=1.9",
    # Pin the fingerprinted mean-pooling behaviour used by the Qdrant case index.
    "fastembed==0.8.0",
    "gliner>=0.2",
    # HIVE deploys on CPU; source pin below prevents unused multi-GB CUDA wheels.
    "torch==2.12.1",
    "playwright>=1.44",
    "reportlab>=4.1",
    "cryptography>=42.0",
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyzbar>=0.1.9",
    "opencv-python>=4.9",
    "pytesseract>=0.3.13",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.2",
    "svglib>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    # NumPy 2.5 stubs use Python 3.12 syntax; mypy checks HIVE's Python 3.11 floor.
    "numpy<2.5",
    "watchfiles>=1.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
hive = "hive.__main__:main"
hive-audit-restore = "hive.audit_restore:main"
hive-case-reindex = "hive.case_reindex:main"
hive-verify = "hive.verify_evidence:main"
hive-redteam = "hive.redteam.evaluate:main"
hive-models-verify = "hive.verify_models:main"
hive-sandbox-verify = "hive.verify_sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_services: transient PostgreSQL and Qdrant integration checks",
]
