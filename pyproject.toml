[project]
name = "hive"
version = "0.1.0"
description = "HIVE — Honeypot for Intelligence, Verdict & Evidence. A deceptive anti-scam agent for Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tho Kai Syuen", email = "TP070466@mail.apu.edu.my" }]

dependencies = [
    "langgraph>=0.2",
    "mem0ai>=0.1",
    "qdrant-client>=1.9",
    "gliner>=0.2",
    "playwright>=1.44",
    "reportlab>=4.1",
    "cryptography>=42.0",
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyzbar>=0.1.9",
    "opencv-python>=4.9",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "watchfiles>=1.2.0",
]

[project.scripts]
hive = "hive.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
